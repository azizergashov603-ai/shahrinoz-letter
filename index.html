<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6dde6">
<title>Для Шахриноз ♡</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="grain"></div>
<div class="hearts" id="hearts" aria-hidden="true"></div>

<div id="app">

  <!-- ACT 1 — стартовый экран -->
  <section class="screen" id="screen-hero" data-screen="hero">
    <div class="hero-inner">
      <p class="eyebrow">для одного человека</p>
      <h1 class="hero-name">Шахриноз<span class="heart-mark">♡</span></h1>
      <p class="hero-sub">У меня для тебя есть письмо.<br>Несколько страниц, которые стоит прочитать не спеша.</p>
      <button class="btn-primary" id="btnStart" type="button">
        <span>Открыть письмо</span>
      </button>
      <p class="hero-hint">лучше с включённым звуком 🎧</p>
    </div>
    <svg class="sprig sprig-left" viewBox="0 0 120 200" aria-hidden="true"><path d="M60 200 C 58 150, 62 120, 60 70" stroke="currentColor" stroke-width="2" fill="none"/><path d="M60 150 C 40 140, 25 120, 22 100" stroke="currentColor" stroke-width="1.6" fill="none"/><path d="M60 120 C 80 112, 95 95, 98 78" stroke="currentColor" stroke-width="1.6" fill="none"/><path d="M60 90 C 42 82, 30 65, 28 50" stroke="currentColor" stroke-width="1.6" fill="none"/><circle cx="60" cy="62" r="7" fill="currentColor" opacity=".55"/></svg>
  </section>

  <!-- ACT 2 — конверт -->
  <section class="screen" id="screen-envelope" data-screen="envelope">
    <div class="envelope-stage">
      <p class="envelope-label" id="envelopeLabel">нажми на конверт</p>
      <div class="envelope-wrap" id="envelopeWrap" role="button" tabindex="0" aria-label="Открыть конверт">
        <div class="envelope" id="envelope">
          <div class="env-shadow"></div>
          <div class="env-back"></div>
          <div class="paper">
            <span>Для тебя</span>
          </div>
          <div class="env-flap-left"></div>
          <div class="env-flap-right"></div>
          <div class="env-flap-top" id="envFlap"></div>
          <div class="seal" id="seal">
            <svg viewBox="0 0 44 44"><path d="M22 33 C10 25 8 14 16 10 C20 8 22 12 22 15 C22 12 24 8 28 10 C36 14 34 25 22 33 Z" fill="currentColor"/></svg>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- ACT 3 — письмо -->
  <section class="screen" id="screen-letter" data-screen="letter">
    <div class="letter-stage">
      <div class="letter-card" id="letterCard">
        <div class="corner corner-tl"></div>
        <div class="corner corner-br"></div>

        <div class="letter-slot" id="letterSlot">
          <!-- страницы письма рендерятся сюда через JS -->
        </div>

        <div class="letter-nav">
          <button class="nav-btn" id="btnPrev" type="button" aria-label="Предыдущая страница">
            <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>

          <div class="dots" id="dots"></div>

          <button class="nav-btn nav-btn-primary" id="btnNext" type="button" aria-label="Следующая страница">
            <svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </div>
      <p class="swipe-hint" id="swipeHint">листай страницы, как настоящее письмо</p>
    </div>
  </section>

</div>

<!-- музыкальный плеер -->
<div class="player" id="player">
  <button class="player-disc" id="playerToggle" type="button" aria-label="Включить музыку">
    <span class="disc" id="disc"></span>
    <svg class="icon-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>
    <svg class="icon-pause" viewBox="0 0 24 24"><path d="M7 5h4v14H7zM13 5h4v14h-4z" fill="currentColor"/></svg>
  </button>
  <div class="player-body">
    <div class="player-info">
      <p class="player-title" id="playerTitle">Stephanie</p>
      <p class="player-sub" id="playerSub">Nafeesisboujee</p>
    </div>
    <div class="eq" id="eq"><span></span><span></span><span></span><span></span></div>
  </div>
  <label class="player-upload" for="audioFile" title="Заменить трек">
    <svg viewBox="0 0 24 24"><path d="M12 4v10m0 0l-3.5-3.5M12 14l3.5-3.5M5 16.5V19a1 1 0 001 1h12a1 1 0 001-1v-2.5" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </label>
  <input id="audioFile" type="file" accept="audio/*" hidden>
</div>
<audio id="audio" loop preload="none"></audio>

<script src="script.js"></script>
</body>
</html>
